services:
  postgres:
    image: postgres:16-alpine
    container_name: coursecity-postgres-dev
    environment:
      POSTGRES_USER: coursecity_user
      POSTGRES_PASSWORD: coursecity_dev_pass
      POSTGRES_DB: coursecity_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coursecity_user -d coursecity_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - coursecity-net

  redis:
    image: redis:7-alpine
    container_name: coursecity-redis-dev
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ../redis/redis.conf:/usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - coursecity-net

volumes:
  postgres_data:
  redis_data:

networks:
  coursecity-net:
    driver: bridge
